apiVersion: 1

groups:
  - orgId: 1
    name: metrics-demo-production-baseline
    folder: Reliability Alerts
    interval: 1m
    rules:
      - uid: mdemo_application_down
        title: Application Down
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: '{__name__="demo.application.ready"}'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: Application readiness is below 100%.
          description: The service is not reporting as ready to accept traffic.
        labels:
          severity: critical
          team: observability

      - uid: mdemo_http_5xx_rate
        title: HTTP 5xx Rate > 5%
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: (sum(rate({__name__="http.server.requests_count", status=~"5.."}[5m])) or vector(0)) / clamp_min(sum(rate({__name__="http.server.requests_count"}[5m])), 1e-9)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: HTTP 5xx error rate is above 5%.
          description: Elevated server-side failures are being returned to callers.
        labels:
          severity: critical
          team: observability

      - uid: mdemo_jvm_heap_warning
        title: JVM Heap > 85%
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 180
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: '{__name__="demo.jvm.heap.usage.ratio"}'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: JVM heap usage is above 85%.
          description: Sustained memory pressure is approaching the critical threshold.
        labels:
          severity: warning
          team: observability

      - uid: mdemo_jvm_heap_critical
        title: JVM Heap > 95%
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 180
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: '{__name__="demo.jvm.heap.usage.ratio"}'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.95
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: JVM heap usage is above 95%.
          description: Immediate memory pressure risk; JVM may be nearing OOM conditions.
        labels:
          severity: critical
          team: observability

      - uid: mdemo_latency_p95_warning
        title: p95 Latency > 1s
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate({__name__="http.server.requests_bucket"}[5m])))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: p95 latency is above 1 second.
          description: User-facing response time is outside the desired warning budget.
        labels:
          severity: warning
          team: observability

      - uid: mdemo_cpu_warning
        title: CPU > 80%
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: '{__name__="process.cpu.usage"}'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.8
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: CPU usage is above 80%.
          description: Sustained CPU pressure can increase latency and reduce throughput.
        labels:
          severity: warning
          team: observability

      - uid: mdemo_db_pool_critical
        title: DB Pool > 90%
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: sum({__name__="hikaricp.connections.active"}) / clamp_min(sum({__name__="hikaricp.connections.max"}), 1)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.9
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Database connection pool usage is above 90%.
          description: Add or tune datasource instrumentation once a database is introduced.
        labels:
          severity: critical
          team: observability

      - uid: mdemo_thread_pool_critical
        title: Thread Pool > 90%
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: sum({__name__="tomcat.threads.busy"}) / clamp_min(sum({__name__="tomcat.threads.current"}), 1)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.9
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Thread pool usage is above 90%.
          description: Busy Tomcat threads indicate request handling saturation.
        labels:
          severity: critical
          team: observability

      - uid: mdemo_no_traffic_warning
        title: No Traffic
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoria-metrics-prometheus
            model:
              datasource:
                type: prometheus
                uid: victoria-metrics-prometheus
              editorMode: code
              expr: sum(rate({__name__="http.server.requests_count"}[5m]))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.01
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: No meaningful traffic has been observed.
          description: The service is idle or unreachable; investigate deployment, routing, or load generation.
        labels:
          severity: warning
          team: observability

